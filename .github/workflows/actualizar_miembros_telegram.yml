name: Reporte Diario Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  reporte-diario-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install telethon supabase --break-system-packages

      - name: Restore Telegram session
        run: echo "${{ secrets.TELEGRAM_SESSION }}" | base64 -d > telegram.session

      - name: Run reporte_diario_telegram.py
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python reporte_diario_telegram.py
