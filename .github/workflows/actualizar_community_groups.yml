name: Actualizar Miembros Actuales

on:
  workflow_dispatch:
  schedule:
    # Corre todos los días a la 1:00 AM UTC
    - cron: '0 5 * * *'

jobs:
  count-members:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # 2. INSTALL TOOLS
      # =========================
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # =========================
      # 3. FETCH GROUPS (red_social = 2 → Facebook)
      # =========================
      # community_groups.id_group ahora tiene relación directa con
      # insights_crecimiento_acumulado_groups.id_group, así que basta con traer id_group.
      - name: Fetch Group IDs from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "📡 Fetching group IDs (red_social=2)..."

          if [ -z "$SUPABASE_KEY" ]; then
            echo "❌ ERROR: SUPABASE_KEY vacío"
            exit 1
          fi

          RESPONSE=$(curl -s \
            "${SUPABASE_URL}/rest/v1/community_groups?select=id_group&red_social=eq.2&limit=1000" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json")

          echo "$RESPONSE" > groups.json

          echo "📄 RAW RESPONSE:"
          cat groups.json

          if ! echo "$RESPONSE" | jq -e 'type == "array"' > /dev/null; then
            echo "❌ ERROR: Supabase no devolvió un array válido"
            exit 1
          fi

          COUNT_GROUPS=$(jq 'length' groups.json)
          echo "✅ Grupos encontrados: $COUNT_GROUPS"

      # =========================
      # 4. FETCH FACEBOOK DATA
      # =========================
      # Llamamos a Graph API con id_group y armamos el payload con id_group + miembros + fecha
      - name: Fetch Facebook data
        env:
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
        run: |
          echo "🔎 Processing Facebook groups..."

          TODAY=$(date -u +%F)
          echo "📅 Fecha del registro: $TODAY"

          RESULT="[]"

          for row in $(jq -c '.[]' groups.json); do

            GROUP_ID=$(echo "$row" | jq -r '.id_group')

            if [ -z "$GROUP_ID" ] || [ "$GROUP_ID" = "null" ]; then
              echo "⚠️ id_group vacío, omitiendo fila"
              continue
            fi

            echo "➡️ Procesando grupo: $GROUP_ID"

            RESPONSE=$(curl -s \
              "https://graph.facebook.com/v25.0/${GROUP_ID}?fields=member_count&access_token=${FACEBOOK_TOKEN}")

            echo "📥 FB RESPONSE: $RESPONSE"

            COUNT=$(echo "$RESPONSE" | jq -r '.member_count // empty')

            if [ -z "$COUNT" ] || [ "$COUNT" = "null" ]; then
              echo "⚠️ Sin member_count"
              continue
            fi

            if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
              echo "⚠️ Valor inválido: $COUNT"
              continue
            fi

            RESULT=$(echo "$RESULT" | jq \
              --argjson id "$GROUP_ID" \
              --argjson count "$COUNT" \
              --arg fecha "$TODAY" \
              '. + [{"id_group": $id, "miembros": $count, "fecha": $fecha}]')
          done

          echo "$RESULT" > insert_payload.json

          echo "📦 PAYLOAD GENERADO:"
          cat insert_payload.json

      # =========================
      # 5. INSERT INTO SUPABASE (histórico diario)
      # =========================
      # FK: insights_crecimiento_acumulado_groups.id_group -> community_groups.id_group (directo)
      # Cada fila incluye id_group, miembros y fecha (snapshot del día).
      - name: Insert into insights_crecimiento_acumulado_groups
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🚀 Insertando registro diario de miembros..."

          if [ ! -s insert_payload.json ]; then
            echo "❌ ERROR: payload vacío"
            exit 1
          fi

          ROW_COUNT=$(jq 'length' insert_payload.json)

          if [ "$ROW_COUNT" -eq 0 ]; then
            echo "⚠️ No hay filas para insertar"
            exit 0
          fi

          echo "📦 Insertando $ROW_COUNT registros en bloque..."

          RESPONSE=$(curl -s -w "\nHTTP: %{http_code}\n" -X POST \
            "${SUPABASE_URL}/rest/v1/insights_crecimiento_acumulado_groups" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d @insert_payload.json)

          echo "$RESPONSE"

          if [[ "$RESPONSE" == *"HTTP: 2"* ]]; then
            echo "✅ Inserción exitosa"
          else
            echo "❌ ERROR en la inserción"
            exit 1
          fi

          echo "🎉 Registro diario completado"
