name: Reporte Diario Facebook

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  reporte-diario-facebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install axios @supabase/supabase-js ws

      - name: Run reporte_diario_facebook.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node reporte_diario_facebook.js
